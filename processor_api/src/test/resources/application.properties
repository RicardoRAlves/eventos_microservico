# RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# CREATE EVENT
rabbitmq.exchange.create.name=events.v1.create-event
rabbitmq.create.queue.name=events.v1.create-queue-event.save-database
rabbitmq.exchange.error.create.name=events.v1.create-error-event

# GET ALL EVENT
rabbitmq.exchange.get-all.name=events.v1.get-all-event
rabbitmq.get-all.queue.name=events.v1.get-all-queue-event

# UPDATE EVENT
rabbitmq.exchange.update.name=events.v1.update-event
rabbitmq.update.queue.name=events.v1.update-queue-event

# DELETE EVENT
rabbitmq.exchange.delete.name=events.v1.delete-event
rabbitmq.delete.queue.name=events.v1.delete-queue-event

# NOTIFICATION EVENT
rabbitmq.exchange.create-notification.name=events.v1.create-notification-event
rabbitmq.exchange.get-all-notification.name=events.v1.get-all-notification-event
rabbitmq.exchange.update-notification.name=events.v1.update-notification-event
rabbitmq.exchange.update-error-notification.name=events.v1.update-error-notification-event
rabbitmq.exchange.delete-notification.name=events.v1.delete-notification-event

# SALE CREATE
rabbitmq.exchange.sale.create.name=events.v1.sale.create-event
rabbitmq.sale.create.queue.name=events.v1.sale.create-queue-event

# SALE UPDATE
rabbitmq.exchange.sale.update.name=events.v1.sale.update-event
rabbitmq.sale.update.queue.name=events.v1.sale.update-queue-event

# SALE DELETE
rabbitmq.exchange.sale.delete.name=events.v1.sale.delete-event
rabbitmq.sale.delete.queue.name=events.v1.sale.delete-queue-event

# SALE NOTIFICATION
rabbitmq.exchange.sale.create-notification.name=events.v1.sale.create-notification-event
rabbitmq.exchange.sale.update-notification.name=events.v1.sale.update-notification-event
rabbitmq.exchange.sale.delete-notification.name=events.v1.sale.delete-notification-event

# SALE RESERVATION
rabbitmq.exchange.sale.create-reservation.name=events.v1.sale.create-reservation
rabbitmq.exchange.sale.create-reservation-processor.name=events.v1.sale.create-reservation-processor

rabbitmq.queue.sale.create-reservation-processor.name=rabbitmq.queue.sale.create-reservation-processor
