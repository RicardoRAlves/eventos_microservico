name: AI Assisted Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr-diff.txt

      - name: Run AI Code Review
        id: ai_review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          REVIEW=$(jq -Rs . < pr-diff.txt)

          RESPONSE=$(curl -s https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"openrouter/free\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are a senior software engineer. Review the Pull Request diff and suggest improvements. Focus on clean code, SOLID, bugs, tests, security, readability, and maintainability. Do not approve or reject the PR. Only provide constructive suggestions.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": $REVIEW
                }
              ]
            }")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai-review.md

      - name: Comment AI review on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const review = fs.readFileSync('ai-review.md', 'utf8');

            const body = `## 🤖 AI-Assisted Code Review

            ${review}

            ---

            _This review was generated automatically by an AI-assisted pipeline. Final approval remains human-driven._`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });