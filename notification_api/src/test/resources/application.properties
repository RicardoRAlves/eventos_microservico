spring.application.name=notification

firebase.enabled=false

# Rabbit Mq
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.username=${RABBIT_USERNAME:rabbitmq}
spring.rabbitmq.password=${RABBIT_PASSWORD:rabbitmq}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Rabbit Mq Create
rabbitmq.exchange.create-notification.name=events.v1.create-notification-event
rabbitmq.queue.create-notification.name=events.v1.queue.create-notification-event

# Rabbit Mq Get
rabbitmq.exchange.get-all-notification.name=events.v1.get-all-notification-event
rabbitmq.queue.get-all-notification.name=events.v1.queue.get-all-notification-event

# Rabbit Mq Update
rabbitmq.exchange.update-notification.name=events.v1.update-notification-event
rabbitmq.queue.update-notification.name=events.v1.queue.update-notification-event

# Rabbit Mq Error
rabbitmq.exchange.error.create.notification.name=events.v1.create-error-notification
rabbitmq.queue.error.create.notification.name=events.v1.create-error-notification-queue
rabbitmq.exchange.update-error-notification.name=events.v1.update-error-notification-event
rabbitmq.queue.update-error-notification.name=events.v1.queue.update-error-notification-event

"rabbitmq.exchange.delete-notification.name=events.v1.delete-notification-event"

rabbitmq.exchange.sale.create-notification.name=events.v1.sale.create-notification-event
rabbitmq.exchange.sale.update-notification.name=events.v1.sale.update-notification-event
rabbitmq.exchange.sale.delete-notification.name=events.v1.sale.delete-notification-event
rabbitmq.queue.delete-notification.name=events.v1.delete-notification-queue
rabbitmq.queue.sale.create-notification.name=events.v1.sale.create-notification-queue
rabbitmq.queue.sale.update-notification.name=events.v1.sale.update-notification-queue
rabbitmq.queue.sale.delete-notification.name=events.v1.sale.delete-notification-queue