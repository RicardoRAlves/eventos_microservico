
server:
  port: 8085

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    retry:
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${AI_MODEL:qwen2.5:3b}
          temperature: 0.3
      embedding:
        options:
          model: nomic-embed-text
  servlet:
    multipart:
      max-file-size: ${FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:11MB}

  datasource:
    url: ${RAG_DB_URL:jdbc:postgresql://localhost:5433/ai_agent_api}
    username: ${RAG_DB_USER:rag_user}
    password: ${RAG_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ${LOG_FILE_PATH:C:/Users/Ricardo/Desktop/Projetos/Events_Microservice/observability/logs/ai_agent_api/ai_agent_api.log}

  level:
    root: INFO
    com.culturaconecta.ai: INFO

cultura-conecta:
  rag:
    max-distance: ${RAG_MAX_DISTANCE:0.36}
    max-results: ${RAG_MAX_RESULTS:5}
