server:
  port: 8085

ai:
  model: qwen2.5-coder:3b

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
      distribution:
        percentiles-histogram:
          http:
            server:
              requests=true:

