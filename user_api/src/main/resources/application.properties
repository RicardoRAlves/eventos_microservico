spring.application.name=user_api
server.port=8082

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=86400000

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_api}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Client
organization.api.url.base=${ORGANIZATION_API_URL_BASE:http://localhost:8081}
organization.api.endpoint=${ORGANIZATION_API_URL_ENDPOINT:http://localhost:8081/api/v2/organizacao/unit/code/}

# AWS S3
aws.access_key_id=${ACCESS_KEY_ID}
aws.secret_access_key=${SECRET_ACCESS_KEY}
s3.bucket=${S3_BUCKET}
s3.region=${S3_REGION}
