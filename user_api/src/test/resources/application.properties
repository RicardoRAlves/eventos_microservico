# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# AWS S3
aws.access_key_id=test-access-key
aws.secret_access_key=test-secret-key
s3.bucket=test-bucket
s3.region=us-east-1

# JWT
security.jwt.secret=test-secret-key-test-secret-key-test
security.jwt.expiration=86400000

# Client
organization.api.url.base=${ORGANIZATION_API_URL_BASE:http://localhost:8081}
organization.api.endpoint=${ORGANIZATION_API_URL_ENDPOINT:/api/v1/organizacao/unit/code/}
