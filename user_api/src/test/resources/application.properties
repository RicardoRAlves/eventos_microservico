# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# AWS S3
aws.access_key_id=test-access-key
aws.secret_access_key=test-secret-key
s3.bucket=test-bucket
s3.region=us-east-1

# JWT
security.jwt.secret=test-secret-key-test-secret-key-test
security.jwt.expiration=86400000

# Client
organization.api.url.base=${ORGANIZATION_API_URL_BASE:http://localhost:8081}
organization.api.endpoint=${ORGANIZATION_API_URL_ENDPOINT:/api/v1/organizacao/unit/code/}

# Rabbit Mq Delete Event
rabbitmq.exchange.delete-notification.name=events.v2.delete-notification-event
rabbitmq.queue.delete-favorite.name=events.v2.queue.delete-favorite-event

# Rabbit Mq Event Sale
rabbitmq.exchange.sale.delete-notification.name=events.v2.delete-notification-sale
rabbitmq.queue.delete-reservation.name=events.v2.queue.delete-reservation-event

# Rabbit Mq Event Sale Reservation
rabbitmq.exchange.sale.create-reservation.name=events.v2.create-reservation-sale
rabbitmq.exchange.sale.create-reservation-processor.name=events.v2.create-reservation-processor-sale
rabbitmq.queue.create-reservation.name=events.v2.queue.create-reservation-event
