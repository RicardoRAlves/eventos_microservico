services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_agent_api
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Defina RAG_DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d ai_agent_api"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rag_postgres_data: