spring.application.name=organization_api
server.port=8081

//Health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:organization_api}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=300000

# Client
user.api.url.base=${USER_API_URL_BASE:http://localhost:8082}
user.api.endpoint.change-role=${USER_API_URL_ENDPOINT:/internal/users/promote-to-super-admin}

# AWS S3
aws.access_key_id=${ACCESS_KEY_ID}
aws.secret_access_key=${SECRET_ACCESS_KEY}
s3.bucket=${S3_BUCKET}
s3.region=${S3_REGION}