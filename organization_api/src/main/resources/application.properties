spring.application.name=organization_api
server.port=${PORT:8081}

# Health check
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# DATA SOURCE
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:organization_api}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA/HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=300000
logging.level.org.springframework.security=DEBUG

# Client
user.api.url.base=${USER_API_URL_BASE:http://localhost:8082}
user.api.endpoint.change-role=${USER_API_URL_ENDPOINT:/internal/users/promote-to-super-admin}
user.api.endpoint.initial-admin=${USER_API_INITIAL_ADMIN_ENDPOINT:/internal/users/initial-admin}
user.api.initial-admin.max-attempts=${USER_API_INITIAL_ADMIN_MAX_ATTEMPTS:30}
user.api.initial-admin.retry-delay-ms=${USER_API_INITIAL_ADMIN_RETRY_DELAY_MS:1000}

# Initial data seed (local and homologation only)
app.initial-data-seed.enabled=${INITIAL_DATA_SEED_ENABLED:false}
app.initial-data-seed.resource=${INITIAL_DATA_SEED_RESOURCE:classpath:seed/bonfim-seed.json}
app.initial-data-seed.admin-name=${INITIAL_ADMIN_NAME:}
app.initial-data-seed.admin-email=${INITIAL_ADMIN_EMAIL:}
app.initial-data-seed.admin-password=${INITIAL_ADMIN_PASSWORD:}
app.initial-data-seed.admin-avatar-url=${INITIAL_ADMIN_AVATAR_URL:}
app.initial-data-seed.organization-name=${INITIAL_ORGANIZATION_NAME:}
app.initial-data-seed.organization-logo-url=${INITIAL_ORGANIZATION_LOGO_URL:}
app.initial-data-seed.organization-unit-name=${INITIAL_ORGANIZATION_UNIT_NAME:}
app.initial-data-seed.organization-unit-contact-phone=${INITIAL_ORGANIZATION_UNIT_CONTACT_PHONE:}

# AWS S3
aws.access_key_id=${ACCESS_KEY_ID}
aws.secret_access_key=${SECRET_ACCESS_KEY}
s3.bucket=${S3_BUCKET}
s3.region=${S3_REGION}

# S3 Local (opcional)
s3.endpoint=${S3_ENDPOINT:}
s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
s3.public-url=${S3_PUBLIC_URL:}

# Observabilidade local
logging.file.name=${LOG_FILE_PATH:C:/Users/Ricardo/Desktop/Projetos/Events_Microservice/observability/logs/organization_api/organization_api.log}

logging.level.root=INFO
logging.level.com.bonfim=INFO
